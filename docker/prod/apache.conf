ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    # Nur public/ ist erreichbar: index.php (CodeIgniter) und die gebaute Vue-App
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html

        RewriteEngine On

        # Authorization-Header an PHP durchreichen
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        # /api -> CodeIgniter
        RewriteRule ^api(/|$) index.php [L]

        # Vorhandene Dateien direkt ausliefern
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]

        # Fehlende Build-Dateien nicht durch die App ersetzen
        RewriteRule ^assets/ - [R=404,L]

        # Alles andere ist eine Route des Vue-Routers
        RewriteRule ^ index.html [L]
    </Directory>

    # Versteckte Dateien (.htaccess usw.) sperren
    <LocationMatch "/\.">
        Require all denied
    </LocationMatch>

    # Dateinamen in assets/ enthalten einen Hash und dürfen lange gecacht werden
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
